<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PITAAAN テクノロジー株式会社</title>
    <!-- タケイチ -->

    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="/components/header/script.js" defer></script>
    <script src="/components/footer/script.js" defer></script>
  </head>
  <body>
    <!-- ヘッダー -->
    <!-- <div id="header-placeholder"></div> -->
    <header></header>

    <!-- Buisiness 実績紹介 -->
    <section id="business" class="section">
      <h2 class="section-title">Business</h2>
      <p class="section-subtitle">実績紹介</p>
      <!-- Swiper -->
      <div class="swiper-container">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <!-- <img src="images/exec1.jpg" alt="bibain" sizes="80w" /> -->
            <img src="images/exec1.jpg" alt="bibain" class="slide-image" />
            <div class="slide-caption">
              <h3>ホテル ビバイン</h3>
              <p>宿泊予約システム付き<br />コーポレートサイト</p>
            </div>
          </div>

          <div class="swiper-slide">
            <img src="images/exec1.jpg" alt="gavtec" class="slide-image" />
            <div class="slide-caption">
              <h3>GavTec美唄</h3>
              <p>行政DX<br />推進サイト</p>
            </div>
          </div>

          <div class="swiper-slide">
            <img src="images/exec1.jpg" alt="melody" class="slide-image" />
            <div class="slide-caption">
              <h3>音楽教室 メロディ</h3>
              <p>生徒募集特化型サイト</p>
            </div>
          </div>
          <!-- スライドを増やす場合はここに追加 -->
        </div>
        <!-- swiper-controls-wrapper -->
        <div class="swiper-controls-bottom">
          <button class="swiper-button-prev">前へ</button>
          <button id="autoplay-toggle" class="swiper-button-pause">⏸</button>
          <button class="swiper-button-next">次へ</button>
        </div>
        <div class="swiper-scrollbar"></div>
      </div>

      <button class="more-btn">
        <a href="#" class="btn-medium"
          >実績一覧を見る<span class="arrow">→</span></a
        >
      </button>
    </section>

    <!-- About 会社概要 -->
    <section id="about" class="section">
      <h2 class="section-title">About</h2>
      <p class="section-subtitle">会社概要</p>
      <div class="about-container">
        <img
          class="about-photo"
          src="images/exec1.jpg"
          alt="代表・メンバー写真"
        />
        <div class="about-text">
          <p>
            地方だからこそできる、お客様ひとりひとりに寄り添ったきめ細かなサービスを心がけております。
          </p>

          <button class="more-btn">
            <a href="#" class="btn-medium"
              >詳細を見る<span class="arrow">→</span></a
            >
          </button>
        </div>
      </div>
    </section>

    <!-- Service 事業内容 -->
    <section id="service" class="section">
      <h2 class="section-title">Service</h2>
      <p class="section-subtitle">サービス概要</p>
      <div class="service-container">
        <div class="service-item">
          <img
            src="images/exec1.jpg"
            alt="Webサイト制作"
            sizes="320w"
            srcset="images/exec1.jpg"
          />
          <h3>Webサイト制作</h3>
          <p>企画から運用まで一貫サポート<br />レスポンシブ・SEO対応</p>
        </div>

        <div class="service-item">
          <img
            src="images/exec1.jpg"
            alt="パンフレット制作"
            sizes="320w"
            srcset="images/exec1.jpg"
          />

          <h3>パンフレット制作</h3>
          <p>企画・デザイン・印刷<br />豊富なデザインパターン</p>
        </div>
        <div class="service-item">
          <img
            src="images/exec1.jpg"
            alt="建築模型"
            sizes="320w"
            srcset="images/exec1.jpg"
          />

          <h3>建築模型・CAD制作</h3>
          <p>高精度な3D建築模型<br />図面作成・修正</p>
        </div>
      </div>

      <button class="more-btn">
        <a href="#" class="btn-medium">
          事業詳細紹介へ
          <span class="arrow">→</span>
        </a>
      </button>
    </section>

    <!-- Contact お問い合わせ -->
    <section id="contact" class="section contact">
      <h2 class="section-title">Contact</h2>
      <p class="section-subtitle">お問い合わせ</p>

      <button class="contact-btn">
        <a href="contact/index.html" class="btn-large">
          <span class="icon">✉️</span>
          お問い合わせをする
          <span class="arrow">→</span>
        </a>
      </button>
    </section>

    <!-- フッターを挿入 -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
    <footer></footer>
  </body>
</html>
