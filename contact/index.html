<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせフォーム</title>

    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="style.css" />

    <script src="/components/header/script.js" defer></script>
    <script src="/components/footer/script.js" defer></script>
  </head>

  <body>
    <header></header>
    <!-- ▼ お問い合わせフォーム全体のコンテナ ▼ -->
    <section class="contact-wrapper">

      <!-- タイトル -->
      <h1>お問い合わせフォーム</h1>

      <!-- ▼ フォーム本体 ▼ -->
      <form id="contactForm" class="contact-form">

        <!-- お名前 -->
        <div class="form-group">
          <label>お名前</label>
          <div class="field-box">
            <input type="text" placeholder="名字 名前" required />
          </div>
        </div>

        <!-- ふりがな -->
        <div class="form-group">
          <label>ふりがな</label>
          <div class="field-box">
            <input type="text" placeholder="みょうじ なまえ" required />
          </div>
        </div>

        <!-- メールアドレス -->
        <div class="form-group">
          <label>メールアドレス</label>
          <div class="field-box">
            <input type="email" placeholder="name@example.com" required />
          </div>
        </div>

        <!-- 電話番号 -->
        <div class="form-group">
          <label>電話番号（任意）</label>
          <div class="field-box">
            <input type="tel" placeholder="000-0000-0000" />
          </div>
        </div>

        <!-- 会社名・団体名 -->
        <div class="form-group">
          <label>会社名・団体名（任意）</label>
          <div class="field-box">
            <input type="text" placeholder="PITAAANテクノロジー株式会社" />
          </div>
        </div>

        <!-- お問い合わせ種別 -->
        <div class="form-group">
          <label>お問い合わせ種別</label>
          <div class="field-box">
            <select required>
              <option value="">選択してください ▼</option>
              <option>Web制作について</option>
              <option>システム開発について</option>
              <option>デザインについて</option>
              <option>採用について</option>
              <option>その他</option>
            </select>
          </div>
        </div>

        <!-- お問い合わせ内容 -->
        <div class="form-group">
          <label>お問い合わせ内容</label>
          <div class="field-box textarea-box">
            <textarea placeholder="お問い合わせ内容をご記入ください" required></textarea>
          </div>
        </div>

        <!-- 送信ボタン -->
        <button type="submit" class="submit-btn">送信する</button>

      </form>
    </section>

    <!-- ▼ 今回追加の "新FAQデザイン" ▼ -->
    <section class="faq-new-wrapper">

      <h2>よくある質問</h2>

      <!-- PDFセクション １ -->
      <div class="faq-block">
        <h3>サービス全般について</h3>

        <div class="faq-item">Q. 個人用ホームページの制作も可能ですか？ <span
            class="arrow">◀</span>
        </div>
        <div class="faq-item">Q. 美唄市以外でも対応していますか？ <span class="arrow">◀</span>
        </div>
        <div class="faq-item">Q. 制作期間はどのくらいかかりますか？ <span class="arrow">◀</span>
        </div>
      </div>

      <!-- PDFセクション ２ -->
      <div class="faq-block">
        <h3>料金について</h3>

        <div class="faq-item">Q. 見積もりは無料ですか？ <span class="arrow">◀</span></div>
        <div class="faq-item">Q. 分割払いは可能ですか？ <span class="arrow">◀</span></div>
      </div>

      <!-- PDFセクション ３ -->
      <div class="faq-block">
        <h3>制作について</h3>

        <div class="faq-item">Q. 途中で仕様変更は可能ですか？ <span class="arrow">◀</span>
        </div>
        <div class="faq-item">Q. 制作後の修正・更新は依頼できますか？ <span class="arrow">◀</span>
        </div>
        <div class="faq-item">Q. スマートフォン対応は標準で含まれていますか？ <span
            class="arrow">◀</span>
        </div>
      </div>

      <!-- PDFセクション ４ -->
      <div class="faq-block">
        <h3>その他</h3>

        <div class="faq-item">Q. 急ぎの案件にも対応できますか？ <span class="arrow">◀</span>
        </div>
        <div class="faq-item">Q. 他社で製作したサイトの修正・リニューアルも可能ですか？ <span
            class="arrow">◀</span></div>
      </div>

    </section>

    <!-- JSファイルの読み込み -->
    <script src="script.js"></script>

    <footer></footer>
  </body>

</html>
